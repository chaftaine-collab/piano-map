<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта обучения — Фортепиано</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap');

:root{
  --bg-deep:#0a0e27;
  --bg-nebula:#1b1140;
  --gold:#f2b84b;
  --gold-soft:#f2b84b55;
  --cyan:#5ec8d8;
  --lavender:#b8b0e0;
  --text:#f2f0fb;
  --card:rgba(255,255,255,0.06);
  --card-border:rgba(255,255,255,0.12);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Manrope',sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at 20% 10%, #2d1b6a33 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, #4b2d7a33 0%, transparent 50%),
    linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-nebula) 100%);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
.stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
.star{position:absolute; background:#fff; border-radius:50%; opacity:0.6; animation:twinkle 3s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:0.2;} 50%{opacity:0.9;}}

h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}

#app{position:relative; z-index:1; max-width:960px; margin:0 auto; padding:32px 20px 80px;}

/* ---------- Header ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:12px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px; height:34px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff 0%, var(--gold) 40%, #b5791f 100%); box-shadow:0 0 18px var(--gold-soft);}
.brand-text{font-size:15px; letter-spacing:0.04em; color:var(--lavender); text-transform:uppercase;}
.teacher-toggle{
  background:var(--card); border:1px solid var(--card-border); color:var(--text);
  padding:8px 14px; border-radius:20px; font-size:13px; cursor:pointer; font-family:'Manrope';
  transition:all .2s;
}
.teacher-toggle.active{background:var(--gold); color:#251505; border-color:var(--gold); font-weight:600;}
.teacher-toggle:hover{opacity:0.85;}

/* ---------- Student select screen ---------- */
.select-screen h1{font-size:28px; margin-bottom:6px;}
.select-screen p{color:var(--lavender); margin-bottom:28px; font-size:15px;}
.student-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:14px; margin-bottom:20px;}
.student-card{
  background:var(--card); border:1px solid var(--card-border); border-radius:16px;
  padding:20px 14px; text-align:center; cursor:pointer; transition:transform .15s, border-color .15s;
}
.student-card:hover{transform:translateY(-3px); border-color:var(--gold-soft);}
.student-avatar{
  width:52px; height:52px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk'; font-weight:600; font-size:18px; color:#1a0e2e;
}
.student-name{font-size:14px; font-weight:600;}
.student-progress{font-size:11px; color:var(--lavender); margin-top:4px;}
.add-student-card{
  background:transparent; border:1.5px dashed var(--card-border); border-radius:16px;
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px;
  cursor:pointer; padding:20px 14px; color:var(--lavender); font-size:13px;
}
.add-student-card:hover{border-color:var(--gold-soft); color:var(--gold);}
.inline-add{display:flex; gap:8px; margin-top:6px;}
.inline-add input{flex:1; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:10px 12px; color:var(--text); font-family:'Manrope'; font-size:14px;}
.inline-add button{background:var(--gold); border:none; border-radius:10px; padding:0 16px; font-weight:600; color:#251505; cursor:pointer;}

/* ---------- Map / system screen ---------- */
.map-header{display:flex; align-items:center; gap:14px; margin-bottom:6px;}
.back-btn{background:none; border:none; color:var(--lavender); cursor:pointer; font-size:20px; padding:4px;}
.map-header .student-avatar{width:44px; height:44px; font-size:16px;}
.map-title{font-size:22px;}
.map-sub{color:var(--lavender); font-size:13px; margin-top:2px;}

.progress-bar-wrap{margin:18px 0 20px;}
.progress-bar-track{height:8px; border-radius:5px; background:rgba(255,255,255,0.08); overflow:hidden;}
.progress-bar-fill{height:100%; background:linear-gradient(90deg, var(--cyan), var(--gold)); border-radius:5px; transition:width .5s ease;}
.progress-label{font-size:12px; color:var(--lavender); margin-top:6px;}

.system-wrap{position:relative; width:100%; height:min(70vh,620px); min-height:380px; border-radius:20px; overflow:hidden; background:radial-gradient(ellipse at center, #170f42 0%, #0a0e27 75%); border:1px solid var(--card-border); margin-bottom:14px; cursor:grab;}
.system-wrap:active{cursor:grabbing;}
.system-wrap canvas{display:block; width:100%; height:100%;}
.system-hint{position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--lavender); opacity:0.55; pointer-events:none; text-align:center; width:90%;}
.lock-toast{position:absolute; top:14px; left:50%; transform:translateX(-50%) translateY(-8px); background:rgba(20,13,56,0.92); border:1px solid var(--card-border); padding:9px 18px; border-radius:20px; font-size:12.5px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; white-space:nowrap;}
.lock-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.system-loading{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--lavender); font-size:13px;}

.add-node-btn{
  display:flex; align-items:center; gap:8px; justify-content:center; width:100%;
  background:transparent; border:1.5px dashed var(--card-border); border-radius:14px; color:var(--lavender);
  padding:14px; cursor:pointer; font-family:'Manrope'; font-size:13px; margin-top:6px;
}
.add-node-btn:hover{border-color:var(--gold-soft); color:var(--gold);}
.map-actions-row{display:flex; gap:10px; flex-wrap:wrap;}
.map-actions-row .add-node-btn{flex:1; margin-top:0;}

/* ---------- Popover / panels ---------- */
.overlay{position:fixed; inset:0; background:rgba(6,4,20,0.6); backdrop-filter:blur(3px); z-index:10; display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto;}
.popover{
  background:linear-gradient(180deg,#1e1550,#140d38); border:1px solid var(--card-border); border-radius:18px;
  padding:26px; max-width:340px; width:100%;
}
.popover.wide{max-width:460px;}
.popover h3{font-size:17px; margin-bottom:4px;}
.popover .desc{color:var(--lavender); font-size:13px; margin-bottom:18px;}
.star-picker{display:flex; gap:10px; margin-bottom:18px;}
.star-picker span{font-size:30px; cursor:pointer; opacity:0.3; transition:opacity .15s, transform .15s;}
.star-picker span.on{opacity:1; transform:scale(1.1);}
.status-row{display:flex; gap:8px; margin-bottom:20px;}
.status-pill{flex:1; text-align:center; padding:9px; border-radius:10px; border:1px solid var(--card-border); font-size:12.5px; cursor:pointer; color:var(--lavender);}
.status-pill.active{background:var(--gold); color:#251505; border-color:var(--gold); font-weight:600;}
.popover-actions{display:flex; gap:10px;}
.btn-primary{flex:1; background:var(--gold); border:none; border-radius:10px; padding:11px; font-weight:600; color:#251505; cursor:pointer; font-family:'Manrope';}
.btn-ghost{background:transparent; border:1px solid var(--card-border); border-radius:10px; padding:11px 16px; color:var(--lavender); cursor:pointer; font-family:'Manrope';}

.panel-header{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:4px;}
.panel-close{background:none; border:none; color:var(--lavender); font-size:20px; cursor:pointer; line-height:1;}
.panel-sub{color:var(--lavender); font-size:12.5px; margin-bottom:16px;}
.mini-btn{background:var(--card); border:1px solid var(--card-border); color:var(--lavender); font-size:11px; padding:3px 9px; border-radius:8px; cursor:pointer; white-space:nowrap;}
.mini-btn:hover{color:var(--text); border-color:var(--gold-soft);}
.mini-btn-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}

.topic-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--card-border); cursor:pointer;}
.topic-row:last-child{border-bottom:none;}
.topic-row.locked{opacity:0.4; cursor:default;}
.t-icon{width:34px; height:34px; min-width:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; background:radial-gradient(circle at 35% 30%,#3a2f66,#1b1440); border:2px solid var(--card-border);}
.topic-row.completed .t-icon{background:radial-gradient(circle at 35% 30%,#fff,var(--gold) 45%,#a06d1e 100%); border-color:var(--gold); color:#251505;}
.topic-row.current .t-icon{border-color:var(--cyan); box-shadow:0 0 10px rgba(94,200,216,0.6);}
.topic-row.test-row .t-icon{background:radial-gradient(circle at 35% 30%,#5ec8d8,#1b6b78);}
.t-body{flex:1; min-width:0;}
.t-name{font-size:13px; font-weight:600;}
.t-stars{font-size:11px; color:var(--gold); margin-top:2px;}
.t-materials{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;}
.t-materials a{font-size:10.5px; color:var(--cyan); text-decoration:none; border:1px solid var(--card-border); border-radius:8px; padding:2px 7px;}
.t-materials a:hover{border-color:var(--cyan);}
.t-edit{display:flex; gap:5px;}
.node-input{background:var(--card); border:1px solid var(--gold-soft); border-radius:8px; padding:6px 10px; color:var(--text); font-family:'Manrope'; font-size:13px; width:150px;}

.repertoire-tabs{display:flex; gap:8px; margin-bottom:14px;}
.repertoire-tabs button{flex:1; background:var(--card); border:1px solid var(--card-border); color:var(--lavender); padding:8px; border-radius:10px; font-size:12px; cursor:pointer; font-family:'Manrope';}
.repertoire-tabs button.active{background:var(--gold); color:#251505; font-weight:600; border-color:var(--gold);}
.rep-item{background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
.rep-title{font-size:14px; font-weight:600;}
.rep-composer{font-size:12px; color:var(--lavender); margin-top:1px;}
.rep-notes{font-size:12px; color:var(--lavender); margin-top:6px; white-space:pre-wrap;}
.rep-links{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
.rep-links a{font-size:10.5px; color:var(--cyan); text-decoration:none; border:1px solid var(--card-border); border-radius:8px; padding:2px 7px;}
.rep-empty{color:var(--lavender); font-size:12.5px; text-align:center; padding:24px 0; opacity:0.7;}
.field-label{font-size:11.5px; color:var(--lavender); text-transform:uppercase; letter-spacing:.04em; margin:14px 0 6px;}
.field-input, .field-textarea{width:100%; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:10px 12px; color:var(--text); font-family:'Manrope'; font-size:13.5px;}
.field-textarea{min-height:70px; resize:vertical;}
.photo-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:8px; margin-top:8px;}
.photo-item{position:relative; border-radius:10px; overflow:hidden; border:1px solid var(--card-border); aspect-ratio:1;}
.photo-item img{width:100%; height:100%; object-fit:cover; display:block;}
.photo-item .photo-remove{position:absolute; top:3px; right:3px; background:rgba(6,4,20,0.75); border:none; color:#fff; border-radius:50%; width:20px; height:20px; font-size:11px; cursor:pointer;}
.photo-item .photo-caption{position:absolute; bottom:0; left:0; right:0; background:rgba(6,4,20,0.75); font-size:9.5px; padding:3px 5px; text-align:center;}

.hint{color:var(--lavender); font-size:12px; text-align:center; margin-top:24px; opacity:0.7;}
.sync-row{font-size:12px; color:var(--cyan); margin-bottom:16px; min-height:16px;}
.sync-row .error{color:#ff8f8f;}
#syncStatus.error{color:#ff8f8f;}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div id="app"><div style="text-align:center;padding:60px 0;color:#b8b0e0;">Загрузка…</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwNzh-WlpmVAOsUN4iwzaQu9zS46mwgQDmcX8YxCs2qFe-HKpg-HEY009SmxpOQPzHL/exec';
const TEACHER_PIN = '8996';
const STUDENT_COLORS = ['#f2b84b','#5ec8d8','#c77dff','#7ee787','#ff8fa3','#7db2ff'];

const PLANET_SKINS = ['mercury','venus','mars','jupiter','saturn','uranus','neptune','pluto'];
const PLANET_LABELS = {mercury:'Меркурий', venus:'Венера', mars:'Марс', jupiter:'Юпитер', saturn:'Сатурн', uranus:'Уран', neptune:'Нептун', pluto:'Плутон'};
const PLANET_COLORS = {mercury:0x9c9c9c, venus:0xe8c39e, mars:0xc1440e, jupiter:0xd8ca9d, saturn:0xe3c078, uranus:0x9fe3e3, neptune:0x4062bb, pluto:0xc9b29b};
const PLANET_SIZES = {mercury:0.55, venus:0.7, mars:0.62, jupiter:1.15, saturn:1.05, uranus:0.85, neptune:0.82, pluto:0.4};
const EARTH_COLOR = 0x3a7bd5, EARTH_SIZE = 0.9;
const SUN_COLOR = 0xf2b84b, SUN_SIZE = 2.1;

function testIdFor(moduleId){ return moduleId + '__test'; }

function buildDefaultModules(){
  return [
    {id:'m1', name:'Нотная грамота', order:1, planet:'mercury', materials:[]},
    {id:'m2', name:'Интервалы', order:2, planet:'venus', materials:[]},
    {id:'m3', name:'Лад и тональность', order:3, planet:'mars', materials:[]},
  ];
}

function buildDefaultCurriculum(){
  const raw = {
    m1: [
      'Знакомство с клавиатурой. Названия нот. Регистры. Октавы. Тона и Полутона.',
      'Нотная грамота. Скрипичный ключ. Обозначение нот на линейках. Аппликатура.',
      'Ритм. Длительности. Размер. Метр. Темп. Пауза. Такт и затакт.',
      'Знакомство с приёмами non legato, legato, staccato.',
      'Особые нотные обозначения. Динамические оттенки.',
      'Альтерация. Знаки альтерации. Ключевые и случайные знаки.',
      'Басовый ключ. Обозначение нот на линейках. Буквенное обозначение нот.',
      'Отработка информации. Соединение рук. Чтение с листа.',
      'Знакомство с педалью.',
      'Изучение композиции наизусть на выбор.',
    ],
    m2: [
      'Интервалы. Названия и виды интервалов.',
      'Количественная (ступеневая) и качественная (тоновая) характеристика интервалов.',
      'Простые и составные интервалы.',
      'Диатонические и хроматические интервалы. Консонансы и диссонансы.',
      'Обращения простых и составных интервалов.',
      'Сольфеджирование. Развитие музыкального слуха, интонации, координации слуха и голоса.',
    ],
    m3: [
      'Лад. Звукоряд. Гамма.',
      'Устойчивые и неустойчивые ступени. Тоническое трезвучие.',
      'Мажорный лад и его виды. Строение.',
      'Основные ступени лада. Главные ступени лада.',
      'Минорный лад и его виды. Строение.',
      'Тональность. Мажорный и минорные тональности.',
      'Одноименные и параллельные тональности.',
      'Энгармонизм тональностей.',
      'Кварто-квинтовый круг.',
    ],
  };
  const moduleNames = {m1:'Нотная грамота', m2:'Интервалы', m3:'Лад и тональность'};
  const out = [];
  Object.keys(raw).forEach(moduleId=>{
    raw[moduleId].forEach((name, idx)=>{
      out.push({id: moduleId+'t'+(idx+1), moduleId, name, desc:'', order: idx+1, isTest:false, materials:[]});
    });
    out.push({id: testIdFor(moduleId), moduleId, name:'Зачёт по модулю «'+moduleNames[moduleId]+'»', desc:'', order: raw[moduleId].length+1, isTest:true, materials:[]});
  });
  return out;
}

let state = {
  modules: null,
  curriculum: null,
  students: null,
  progress: {}, // studentId -> {topicId: {status, stars}}
  repertoire: [], // {id,studentId,title,composer,status,notes,links,addedAt}
  profiles: {}, // studentId -> {goals, bio, photos:[{url,caption}]}
  view: 'select', // 'select' | 'map' | 'linkError'
  currentStudent: null,
  teacherMode: false,
  studentLinkMode: false,
};

let threeCtx = null; // { renderer, scene, camera, controls, animId, clickTargets, container, resizeHandler, clickHandler }

const URL_STUDENT_ID = new URLSearchParams(window.location.search).get('student');

function safeParseJSON(str, fallback){
  if(str == null || str === '') return fallback;
  if(typeof str !== 'string') return str;
  try{ const v = JSON.parse(str); return v==null ? fallback : v; }catch(e){ return fallback; }
}

function studentLink(studentId){
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set('student', studentId);
  return url.toString();
}

async function copyStudentLink(studentId){
  const link = studentLink(studentId);
  try{
    await navigator.clipboard.writeText(link);
    alert('Ссылка скопирована:\n' + link);
  }catch(e){
    window.prompt('Скопируй ссылку вручную:', link);
  }
}

async function deleteStudent(studentId){
  state.students = state.students.filter(s => s.id !== studentId);
  delete state.progress[studentId];
  delete state.profiles[studentId];
  state.repertoire = state.repertoire.filter(r => r.studentId !== studentId);
  render();
  saveAllToServer();
}

function starsField(){
  const container = document.getElementById('stars');
  for(let i=0;i<40;i++){
    const s = document.createElement('div');
    s.className='star';
    s.style.width = s.style.height = (Math.random()*2+1)+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    container.appendChild(s);
  }
}
starsField();

function debugLog(msg, isError){
  state.syncStatus = {msg, isError};
  const el = document.getElementById('syncStatus');
  if(el){
    el.textContent = msg;
    el.classList.toggle('error', !!isError);
  }
}

function progressToArray(){
  const arr = [];
  Object.keys(state.progress).forEach(studentId => {
    const topics = state.progress[studentId] || {};
    Object.keys(topics).forEach(topicId => {
      const p = topics[topicId];
      arr.push({studentId, topicId, status: p.status, stars: p.stars||0});
    });
  });
  return arr;
}

function arrayToProgress(arr){
  const obj = {};
  (arr||[]).forEach(row => {
    const sid = String(row.studentId), tid = String(row.topicId);
    if(!obj[sid]) obj[sid] = {};
    obj[sid][tid] = {status: row.status, stars: Number(row.stars)||0};
  });
  return obj;
}

function profilesToArray(){
  return Object.keys(state.profiles).map(sid => ({
    studentId: sid,
    goals: state.profiles[sid].goals || '',
    bio: state.profiles[sid].bio || '',
    photos: JSON.stringify(state.profiles[sid].photos || []),
  }));
}

function arrayToProfiles(arr){
  const obj = {};
  (arr||[]).forEach(row => {
    obj[String(row.studentId)] = {
      goals: row.goals || '',
      bio: row.bio || '',
      photos: safeParseJSON(row.photos, []),
    };
  });
  return obj;
}

function normalizeCurriculum(list){
  return (list||[]).map(t => ({
    id: String(t.id), moduleId: t.moduleId!=null ? String(t.moduleId) : '', name: t.name, desc: t.desc||'',
    order: Number(t.order)||0, isTest: !!(t.isTest===true || t.isTest==='true' || t.isTest===1),
    materials: safeParseJSON(t.materials, Array.isArray(t.materials)?t.materials:[]),
  }));
}

// Data from before the module/planet redesign has no moduleId column at all —
// treat that shape as legacy and reseed with the new default curriculum instead of using it as-is.
function curriculumOrDefault(rawList){
  const curr = normalizeCurriculum(rawList);
  return (curr.length && curr.every(t=>t.moduleId)) ? curr : buildDefaultCurriculum();
}

function normalizeModules(list){
  return (list||[]).map(m => ({
    id: String(m.id), name: m.name, order: Number(m.order)||0,
    planet: m.planet || PLANET_SKINS[0],
    materials: safeParseJSON(m.materials, Array.isArray(m.materials)?m.materials:[]),
  }));
}

function normalizeRepertoire(list){
  return (list||[]).map(r => ({
    id: String(r.id), studentId: String(r.studentId), title: r.title, composer: r.composer||'',
    status: r.status || 'current', notes: r.notes||'',
    links: safeParseJSON(r.links, Array.isArray(r.links)?r.links:[]),
    addedAt: r.addedAt || '',
  }));
}

function exportData(){
  const payload = {
    students: state.students,
    modules: state.modules,
    curriculum: state.curriculum,
    progress: progressToArray(),
    repertoire: state.repertoire,
    profiles: profilesToArray(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'piano-map-data.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importData(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      state.students = (data.students||[]).map(s=>({id:String(s.id), name:s.name, color:s.color}));
      state.modules = (data.modules && data.modules.length) ? normalizeModules(data.modules) : buildDefaultModules();
      state.curriculum = curriculumOrDefault(data.curriculum);
      state.progress = arrayToProgress(data.progress);
      state.repertoire = normalizeRepertoire(data.repertoire);
      state.profiles = arrayToProfiles(data.profiles);
      debugLog('✔ Файл загружен');
      await saveAllToServer();
      render();
    }catch(err){
      debugLog('⚠ Не удалось прочитать файл: ' + err.message, true);
    }
  };
  reader.readAsText(file);
}

    await fetch(API_URL, {
      method:'POST',
      body: JSON.stringify({action:'saveAll', data:{
        students: state.students,

        curriculum: state.curriculum,

        repertoire: state.repertoire,

async function loadAll(){
  debugLog('Загрузка из таблицы…');
  try{
    const res = await fetch(API_URL + '?action=getAll');
    const data = await res.json();
    state.students = (data.students||[]).map(s=>({id:String(s.id), name:s.name, color:s.color}));
    state.modules = (data.modules && data.modules.length) ? normalizeModules(data.modules) : buildDefaultModules();
    state.curriculum = curriculumOrDefault(data.curriculum);
    state.progress = arrayToProgress(data.progress);
    state.repertoire = normalizeRepertoire(data.repertoire);
    state.profiles = arrayToProfiles(data.profiles);
    debugLog('☁ Синхронизировано');
    if(!data.curriculum || !data.curriculum.length || !data.modules || !data.modules.length){
      await saveAllToServer(); // заполняем таблицу данными по умолчанию при первом запуске / после обновления структуры
    }
  }catch(e){
    state.modules = buildDefaultModules();

/* ---------- Curriculum / progress computation ---------- */

function buildOrderedCurriculum(){
  const modules = [...state.modules].sort((a,b)=>a.order-b.order);
  const out = [];
  modules.forEach(m=>{
    const topics = state.curriculum.filter(t=>t.moduleId===m.id && !t.isTest).sort((a,b)=>a.order-b.order);
    const test = state.curriculum.find(t=>t.moduleId===m.id && t.isTest);
    topics.forEach(t=>out.push(t));
    if(test) out.push(test);
  });
  return out;
}

function computeItemStatuses(studentId){
  const prog = state.progress[studentId] || {};
  const list = buildOrderedCurriculum();
  let firstIncompleteFound = false;
  return list.map(t => {
    const p = prog[t.id];
    let status = 'locked';
    if(p && p.status === 'completed') status = 'completed';
    else if(!firstIncompleteFound){ status = 'current'; firstIncompleteFound = true; }
    return {...t, status, stars: p ? (p.stars||0) : 0};
  });
}

function computeModuleStatuses(studentId){
  const items = computeItemStatuses(studentId);
  const modules = [...state.modules].sort((a,b)=>a.order-b.order);
  return modules.map(m=>{
    const mine = items.filter(i=>i.moduleId===m.id);
    let status = 'locked';
    if(mine.length && mine.every(i=>i.status==='completed')) status = 'completed';
    else if(mine.some(i=>i.status==='current')) status = 'current';
    return {...m, status, items: mine};
  });
}

function topicsForModule(moduleId){
  return state.curriculum.filter(t=>t.moduleId===moduleId && !t.isTest).sort((a,b)=>a.order-b.order);
}
function testForModule(moduleId){
  return state.curriculum.find(t=>t.moduleId===moduleId && t.isTest);
}

function attachSelectHandlers(){
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(file){
      if(!verifyTeacherPin()){ e.target.value=''; return; }
      importData(file);
    }
    e.target.value = '';
  });
  document.querySelectorAll('.copy-link-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      copyStudentLink(btn.dataset.id);
    });
  });
  document.querySelectorAll('.delete-student-btn').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!verifyTeacherPin()) return;
      const ok = window.confirm(`Удалить ученика «${btn.dataset.name}»? Весь его прогресс тоже удалится. Это нельзя отменить.`);
      if(ok) await deleteStudent(btn.dataset.id);
    });
  });
  document.querySelectorAll('.student-card').forEach(card=>{
    card.addEventListener('click', async (e)=>{
      if(e.target.closest('.copy-link-btn') || e.target.closest('.delete-student-btn')) return;
      const id = card.dataset.id;
      state.currentStudent = state.students.find(s=>s.id===id);
      await loadProgress(id);
      state.view = 'map';
      render();
    });
  });
  document.getElementById('addStudentBtn').addEventListener('click', ()=>{
    document.getElementById('addStudentForm').style.display='flex';
    document.getElementById('newStudentName').focus();
  });
  const confirmAdd = async ()=>{
    if(!verifyTeacherPin()) return;
    const input = document.getElementById('newStudentName');
    const name = input.value.trim();
    if(!name) return;
    const color = STUDENT_COLORS[state.students.length % STUDENT_COLORS.length];
    const id = 's_' + Date.now();
    const newStudent = {id, name, color};
    state.students.push(newStudent);
    state.currentStudent = newStudent;
    await loadProgress(id);
    state.teacherMode = true;
    state.view = 'map';
    render();
    saveStudents();
  };

  document.getElementById('newStudentName').addEventListener('keydown', e=>{ if(e.key==='Enter') confirmAdd(); });
}

/* ---------- Three.js solar system ---------- */

function makeGlowTexture(hexColor){
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const c = new THREE.Color(hexColor);
  const grd = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  grd.addColorStop(0, `rgba(${c.r*255},${c.g*255},${c.b*255},0.9)`);
  grd.addColorStop(0.4, `rgba(${c.r*255},${c.g*255},${c.b*255},0.35)`);
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(canvas);
}

function planetVisualColor(baseColor, status){
  const c = new THREE.Color(baseColor);
  if(status === 'locked'){ c.multiplyScalar(0.28); }
  return c;
}

function disposeThree(){
  if(!threeCtx) return;
  cancelAnimationFrame(threeCtx.animId);
  if(threeCtx.container){
    threeCtx.container.removeEventListener('click', threeCtx.clickHandler);
  }
  window.removeEventListener('resize', threeCtx.resizeHandler);
  threeCtx.renderer.dispose();
  threeCtx = null;
}

function mountThreeScene(student){
  const wrap = document.getElementById('systemWrap');
  if(!wrap || typeof THREE === 'undefined') return;

  const moduleStatuses = computeModuleStatuses(student.id);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0e27, 0.012);

  const camera = new THREE.PerspectiveCamera(55, wrap.clientWidth/wrap.clientHeight, 0.1, 600);
  camera.position.set(0, 22, 34);

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  const loadingEl = document.getElementById('systemLoading');
  if(loadingEl) loadingEl.remove();
  wrap.insertBefore(renderer.domElement, wrap.firstChild);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 6;
  controls.maxDistance = 120;

  scene.add(new THREE.AmbientLight(0x404868, 1.3));
  const sunLight = new THREE.PointLight(0xffe9c2, 2.4, 260);
  scene.add(sunLight);

  // starfield
  const starGeo = new THREE.BufferGeometry();
  const starCount = 900;
  const starPos = new Float32Array(starCount*3);
  for(let i=0;i<starCount;i++){
    const r = 80 + Math.random()*180;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos((Math.random()*2)-1);
    starPos[i*3] = r*Math.sin(phi)*Math.cos(theta);
    starPos[i*3+1] = r*Math.cos(phi);
    starPos[i*3+2] = r*Math.sin(phi)*Math.sin(theta);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
  const starMat = new THREE.PointsMaterial({color:0xffffff, size:0.5, sizeAttenuation:true, transparent:true, opacity:0.75});
  scene.add(new THREE.Points(starGeo, starMat));

  // sun
  const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(SUN_SIZE, 32, 32), new THREE.MeshBasicMaterial({color:SUN_COLOR}));
  scene.add(sunMesh);
  const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({map:makeGlowTexture(SUN_COLOR), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false}));
  sunGlow.scale.set(SUN_SIZE*7, SUN_SIZE*7, 1);
  scene.add(sunGlow);

  const clickTargets = [];
  const orbitables = []; // {mesh, radius, angle, speed, statusGroup}

  function addOrbitRing(radius){
    const curve = new THREE.EllipseCurve(0,0, radius, radius, 0, Math.PI*2, false, 0);
    const pts = curve.getPoints(96).map(p=>new THREE.Vector3(p.x,0,p.y));
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({color:0x6a5fb0, transparent:true, opacity:0.22});
    scene.add(new THREE.LineLoop(geo, mat));
  }

  function makeBody({radius, size, color, angle, speed, status, label, userData, ring}){
    addOrbitRing(radius);
    const geo = new THREE.SphereGeometry(size, 28, 28);
    const mat = new THREE.MeshStandardMaterial({
      color: planetVisualColor(color, status),
      roughness: 0.6, metalness: 0.1,
      emissive: status==='completed' ? new THREE.Color(0xf2b84b) : (status==='current' ? new THREE.Color(0x2f7480) : new THREE.Color(0x000000)),
      emissiveIntensity: status==='completed' ? 0.55 : (status==='current' ? 0.9 : 0),
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(radius*Math.cos(angle), 0, radius*Math.sin(angle));
    scene.add(mesh);

    if(ring){
      const ringGeo = new THREE.RingGeometry(size*1.4, size*1.7, 48);
      const ringMat = new THREE.MeshBasicMaterial({color:0xcbb789, side:THREE.DoubleSide, transparent:true, opacity:0.55});
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.rotation.x = Math.PI/2.4;
      mesh.add(ringMesh);
    }

    if(status === 'completed'){
      const haloGeo = new THREE.RingGeometry(size*1.25, size*1.35, 40);
      const haloMat = new THREE.MeshBasicMaterial({color:0xf2b84b, side:THREE.DoubleSide, transparent:true, opacity:0.5});
      const halo = new THREE.Mesh(haloGeo, haloMat);
      halo.rotation.x = Math.PI/2;
      mesh.add(halo);
    }

    const orbitEntry = {mesh, radius, angle, speed, status, pulse: status==='current'};
    orbitables.push(orbitEntry);
    if(userData) { mesh.userData = userData; clickTargets.push(mesh); }
    return mesh;
  }

  // Earth — home base, always unlocked
  makeBody({radius:5, size:EARTH_SIZE, color:EARTH_COLOR, angle:Math.PI*0.15, speed:0.06, status:'completed',
    userData:{type:'earth'}});

  // Repertoire / wishlist moons near Earth
  makeBody({radius:2.6, size:0.28, color:0x7ee787, angle:1.1, speed:0.22, status:'completed',
    userData:{type:'repertoire'}});
  makeBody({radius:2.6, size:0.28, color:0xff8fa3, angle:4.2, speed:0.22, status:'completed',
    userData:{type:'wishlist'}});

  // Module planets
  moduleStatuses.forEach((m, idx)=>{
    const radius = 9 + idx*4.5;
    const size = PLANET_SIZES[m.planet] || 0.6;
    const color = PLANET_COLORS[m.planet] || 0xffffff;
    makeBody({
      radius, size, color,
      angle: idx*1.7, speed: 0.045/(1+idx*0.35),
      status: m.status,
      ring: m.planet === 'saturn',
      userData:{type:'module', moduleId:m.id, name:m.name, status:m.status},
    });
  });

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  function clickHandler(ev){
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((ev.clientX-rect.left)/rect.width)*2-1;
    mouse.y = -((ev.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(clickTargets, false);
    if(!hits.length) return;
    const ud = hits[0].object.userData;
    if(ud.type === 'earth') openEarthPanel();
    else if(ud.type === 'repertoire') openRepertoirePanel('current');
    else if(ud.type === 'wishlist') openRepertoirePanel('wishlist');
    else if(ud.type === 'module'){
      if(ud.status === 'locked'){
        const idx = moduleStatuses.findIndex(m=>m.id===ud.moduleId);
        const prev = idx>0 ? moduleStatuses[idx-1] : null;
        showLockToast(prev ? `Сначала пройди «${prev.name}»` : 'Этот модуль пока закрыт');
      } else {
        openModulePanel(ud.moduleId);
      }
    }
  }
  renderer.domElement.addEventListener('click', clickHandler);

  function resizeHandler(){
    if(!wrap.isConnected) return;
    camera.aspect = wrap.clientWidth/wrap.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  }
  window.addEventListener('resize', resizeHandler);

  const clock = new THREE.Clock();
  function animate(){
    const t = clock.getElapsedTime();
    orbitables.forEach(o=>{
      o.angle += o.speed*0.01;
      o.mesh.position.set(o.radius*Math.cos(o.angle), 0, o.radius*Math.sin(o.angle));
      if(o.pulse){
        const s = 1 + Math.sin(t*2.2)*0.08;
        o.mesh.scale.set(s,s,s);
      }
    });
    controls.update();
    renderer.render(scene, camera);
    threeCtx.animId = requestAnimationFrame(animate);
  }

  threeCtx = {renderer, scene, camera, controls, animId:0, clickTargets, container: renderer.domElement, resizeHandler, clickHandler};
  animate();
}

function showLockToast(msg){
  const el = document.getElementById('lockToast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(()=> el.classList.remove('show'), 2200);
}

/* ---------- Module topic panel ---------- */

function closeAllOverlays(){
  document.querySelectorAll('.overlay').forEach(o=>o.remove());
}

function openModulePanel(moduleId){
  closeAllOverlays();
  const student = state.currentStudent;
  const mod = state.modules.find(m=>m.id===moduleId);
  if(!mod) return;
  const itemStatuses = computeItemStatuses(student.id).filter(i=>i.moduleId===moduleId);

  const rows = itemStatuses.map(t=>{
    let icon = '☆';
    if(t.status==='completed') icon = t.isTest ? '✓' : '★';
    else if(t.status==='current') icon = t.isTest ? '📝' : '●';
    else icon = '🔒';
    const starsStr = (!t.isTest && t.status==='completed') ? '★'.repeat(t.stars) + '☆'.repeat(3-t.stars) : '';
    const materialsHtml = (t.materials && t.materials.length) ? `<div class="t-materials">${t.materials.map(m=>`<a href="${escapeAttr(m.url)}" target="_blank" rel="noopener">${escapeHtml(m.label||m.url)}</a>`).join('')}</div>` : '';
    const editControls = (state.teacherMode && !t.isTest) ? `
      <div class="t-edit">
        <button class="mini-btn rename-topic-btn" data-id="${t.id}">переим.</button>
        <button class="mini-btn material-topic-btn" data-id="${t.id}">📎</button>
        <button class="mini-btn remove-topic-btn" data-id="${t.id}">✕</button>
      </div>` : '';
    return `<div class="topic-row ${t.status} ${t.isTest?'test-row':''}" data-id="${t.id}" data-test="${t.isTest?'1':'0'}" data-locked="${t.status==='locked'?'1':'0'}">
      <div class="t-icon">${icon}</div>
      <div class="t-body">
        <div class="t-name" data-name-id="${t.id}">${escapeHtml(t.name)}</div>
        ${starsStr ? `<div class="t-stars">${starsStr}</div>` : ''}
        ${materialsHtml}
      </div>
      ${editControls}
    </div>`;
  }).join('');

  const materialsHtml = (mod.materials && mod.materials.length) ? `<div class="t-materials">${mod.materials.map(m=>`<a href="${escapeAttr(m.url)}" target="_blank" rel="noopener">${escapeHtml(m.label||m.url)}</a>`).join('')}</div>` : '';

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="popover wide">
      <div class="panel-header">
        <div>
          <h3 class="display" data-module-name>${escapeHtml(mod.name)}</h3>
          <div class="panel-sub">${PLANET_LABELS[mod.planet]||''} · модуль обучения</div>
        </div>
        <button class="panel-close" id="closeModulePanel">✕</button>
      </div>
      ${materialsHtml}
      ${state.teacherMode ? `<div class="mini-btn-row">
        <button class="mini-btn" id="renameModuleBtn">переим. модуль</button>
        <button class="mini-btn" id="materialModuleBtn">📎 материал</button>
        <button class="mini-btn" id="addTopicBtn">＋ тема</button>
        <button class="mini-btn" id="removeModuleBtn">✕ удалить модуль</button>
      </div>` : ''}
      <div>${rows}</div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#closeModulePanel').addEventListener('click', ()=> overlay.remove());

  overlay.querySelectorAll('.topic-row').forEach(row=>{
    row.addEventListener('click', (e)=>{
      if(e.target.closest('.t-edit')) return;
      if(row.dataset.locked==='1') return;
      const id = row.dataset.id;
      if(row.dataset.test==='1'){
        toggleTestPass(student.id, id, moduleId);
      } else {
        const topic = state.curriculum.find(t=>t.id===id);
        openTopicEditor(topic, moduleId);
      }
    });
  });

  if(state.teacherMode){
    overlay.querySelectorAll('.rename-topic-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const id = btn.dataset.id;
        const el = overlay.querySelector(`[data-name-id="${id}"]`);
        const topic = state.curriculum.find(t=>t.id===id);
        el.outerHTML = `<input class="node-input" data-name-input="${id}" value="${escapeAttr(topic.name)}">`;
        const input = overlay.querySelector(`[data-name-input="${id}"]`);
        input.focus(); input.select();
        const commit = ()=>{
          topic.name = input.value.trim() || topic.name;
          overlay.remove();
          render();
          openModulePanel(moduleId);
          saveCurriculum();
        };
        input.addEventListener('keydown', ev=>{ if(ev.key==='Enter') commit(); });
        input.addEventListener('blur', commit);
      });
    });
    overlay.querySelectorAll('.material-topic-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const topic = state.curriculum.find(t=>t.id===btn.dataset.id);
        if(!addMaterialPrompt(topic)) return;
        overlay.remove();
        render();
        openModulePanel(moduleId);
        saveCurriculum();
      });
    });
    overlay.querySelectorAll('.remove-topic-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        state.curriculum = state.curriculum.filter(t=>t.id!==btn.dataset.id);
        overlay.remove();
        render();
        openModulePanel(moduleId);
        saveCurriculum();
      });
    });
    const addTopicBtn = overlay.querySelector('#addTopicBtn');
    if(addTopicBtn) addTopicBtn.addEventListener('click', ()=>{
      const name = window.prompt('Название новой темы:');
      if(!name || !name.trim()) return;
      const existingTopics = topicsForModule(moduleId);
      const test = testForModule(moduleId);
      const newOrder = existingTopics.length + 1;
      if(test) test.order = newOrder + 1;
      const id = 't_' + Date.now();
      state.curriculum.push({id, moduleId, name:name.trim(), desc:'', order:newOrder, isTest:false, materials:[]});
      overlay.remove();
      render();
      openModulePanel(moduleId);
      saveCurriculum();
    });
    const renameModuleBtn = overlay.querySelector('#renameModuleBtn');
    if(renameModuleBtn) renameModuleBtn.addEventListener('click', ()=>{
      const name = window.prompt('Новое название модуля:', mod.name);
      if(!name || !name.trim()) return;
      mod.name = name.trim();
      overlay.remove();
      render();
      openModulePanel(moduleId);
      saveCurriculum();
    });
    const materialModuleBtn = overlay.querySelector('#materialModuleBtn');
    if(materialModuleBtn) materialModuleBtn.addEventListener('click', ()=>{
      if(!addMaterialPrompt(mod)) return;
      overlay.remove();
      render();
      openModulePanel(moduleId);
      saveCurriculum();
    });
    const removeModuleBtn = overlay.querySelector('#removeModuleBtn');
    if(removeModuleBtn) removeModuleBtn.addEventListener('click', ()=>{
      const ok = window.confirm(`Удалить модуль «${mod.name}» вместе со всеми его темами?`);
      if(!ok) return;
      state.curriculum = state.curriculum.filter(t=>t.moduleId!==moduleId);
      state.modules = state.modules.filter(m=>m.id!==moduleId);
      overlay.remove();
      render();
      saveCurriculum();
    });
  }
}

function addMaterialPrompt(target){
  const label = window.prompt('Название материала:');
  if(label===null) return false;
  const url = window.prompt('Ссылка (URL):');
  if(url===null || !url.trim()) return false;
  if(!target.materials) target.materials = [];
  target.materials.push({label: label.trim()||url.trim(), url: url.trim()});
  return true;
}

function toggleTestPass(studentId, testId, moduleId){
  const prog = state.progress[studentId] || {};
  const current = prog[testId];
  if(current && current.status==='completed'){
    delete prog[testId];
  } else {
    prog[testId] = {status:'completed', stars:0};
  }
  state.progress[studentId] = prog;
  render();
  openModulePanel(moduleId);
  saveProgress(studentId);
}

function openTopicEditor(topic, moduleId){
  const student = state.currentStudent;
  const prog = state.progress[student.id] || {};
  const current = prog[topic.id] || {status:'locked', stars:0};
  let selectedStars = current.stars || 0;
  let selectedStatus = current.status === 'completed' ? 'completed' : 'progress';

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="popover">
      <h3 class="display">${escapeHtml(topic.name)}</h3>
      <div class="desc">${escapeHtml(topic.desc||'')}</div>
      ${state.teacherMode ? `
        <div class="status-row">
          <div class="status-pill ${selectedStatus==='progress'?'active':''}" data-status="progress">В процессе</div>
          <div class="status-pill ${selectedStatus==='completed'?'active':''}" data-status="completed">Пройдено</div>
        </div>
        <div class="star-picker" id="starPicker">
          ${[1,2,3].map(n=>`<span data-n="${n}" class="${n<=selectedStars?'on':''}">★</span>`).join('')}
        </div>
        <div class="popover-actions">
          <button class="btn-ghost" id="cancelPop">Отмена</button>
          <button class="btn-primary" id="savePop">Сохранить</button>
        </div>
      ` : `
        <div class="popover-actions">
          <button class="btn-ghost" id="cancelPop" style="flex:1;">Закрыть</button>
        </div>
      `}
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#cancelPop').addEventListener('click', ()=> overlay.remove());

  if(state.teacherMode){
    overlay.querySelectorAll('.status-pill').forEach(p=>{
      p.addEventListener('click', ()=>{
        selectedStatus = p.dataset.status;
        overlay.querySelectorAll('.status-pill').forEach(x=>x.classList.remove('active'));
        p.classList.add('active');
      });
    });
    overlay.querySelectorAll('#starPicker span').forEach(s=>{
      s.addEventListener('click', ()=>{
        selectedStars = parseInt(s.dataset.n);
        overlay.querySelectorAll('#starPicker span').forEach(x=>{
          x.classList.toggle('on', parseInt(x.dataset.n) <= selectedStars);
        });
      });
    });
    overlay.querySelector('#savePop').addEventListener('click', ()=>{
      prog[topic.id] = {status: selectedStatus, stars: selectedStatus==='completed' ? selectedStars : 0};
      state.progress[student.id] = prog;
      overlay.remove();
      render();
      openModulePanel(moduleId);
      saveProgress(student.id);
    });
  }
}

/* ---------- Earth / profile panel ---------- */

function openEarthPanel(){
  closeAllOverlays();
  const student = state.currentStudent;
  if(!state.profiles[student.id]) state.profiles[student.id] = {goals:'', bio:'', photos:[]};
  const profile = state.profiles[student.id];

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="popover wide">
      <div class="panel-header">
        <div>
          <h3 class="display">🌍 База ученика</h3>
          <div class="panel-sub">${escapeHtml(student.name)}</div>
        </div>
        <button class="panel-close" id="closeEarthPanel">✕</button>
      </div>
      <div class="field-label">Цели обучения</div>
      ${state.teacherMode
        ? `<textarea class="field-textarea" id="goalsInput" placeholder="Например: выучить произведение к концерту в мае">${escapeHtml(profile.goals)}</textarea>`
        : `<div class="desc">${escapeHtml(profile.goals) || 'Пока не заполнено.'}</div>`}
      <div class="field-label">О себе</div>
      ${state.teacherMode
        ? `<textarea class="field-textarea" id="bioInput" placeholder="Возраст, интересы, особенности обучения">${escapeHtml(profile.bio)}</textarea>`
        : `<div class="desc">${escapeHtml(profile.bio) || 'Пока не заполнено.'}</div>`}
      <div class="field-label">Фото с выступлений</div>
      <div class="photo-grid" id="photoGrid">
        ${(profile.photos||[]).map((p,idx)=>`
          <div class="photo-item">
            <img src="${escapeAttr(p.url)}" alt="${escapeAttr(p.caption||'')}" onerror="this.style.opacity=0.15">
            ${p.caption ? `<div class="photo-caption">${escapeHtml(p.caption)}</div>` : ''}
            ${state.teacherMode ? `<button class="photo-remove" data-idx="${idx}">✕</button>` : ''}
          </div>
        `).join('')}
      </div>
      ${state.teacherMode ? '<button class="mini-btn" id="addPhotoBtn" style="margin-top:10px;">＋ добавить фото (ссылка)</button>' : ''}
      ${state.teacherMode ? `<div class="popover-actions" style="margin-top:18px;">
        <button class="btn-ghost" id="cancelEarth">Отмена</button>
        <button class="btn-primary" id="saveEarth">Сохранить</button>
      </div>` : ''}
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#closeEarthPanel').addEventListener('click', ()=> overlay.remove());
  const cancelBtn = overlay.querySelector('#cancelEarth');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=> overlay.remove());

  if(state.teacherMode){
    overlay.querySelectorAll('.photo-remove').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        profile.photos.splice(parseInt(btn.dataset.idx),1);
        overlay.remove();
        openEarthPanel();
      });
    });
    const addPhotoBtn = overlay.querySelector('#addPhotoBtn');
    if(addPhotoBtn) addPhotoBtn.addEventListener('click', ()=>{
      const url = window.prompt('Ссылка на фото (Google Фото/Диск):');
      if(!url || !url.trim()) return;
      const caption = window.prompt('Подпись (необязательно):') || '';
      profile.photos = profile.photos || [];
      profile.photos.push({url:url.trim(), caption:caption.trim()});
      overlay.remove();
      openEarthPanel();
    });
    overlay.querySelector('#saveEarth').addEventListener('click', ()=>{
      profile.goals = overlay.querySelector('#goalsInput').value.trim();
      profile.bio = overlay.querySelector('#bioInput').value.trim();
      state.profiles[student.id] = profile;
      overlay.remove();
      saveProfile();
    });
  }
}

/* ---------- Repertoire / wishlist panel ---------- */

function openRepertoirePanel(initialTab){
  closeAllOverlays();
  const student = state.currentStudent;
  let activeTab = initialTab || 'current';

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="popover wide"></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });

  function renderPanel(){
    const items = state.repertoire.filter(r=>r.studentId===student.id && r.status===activeTab);
    const tabLabels = {current:'Играю сейчас', wishlist:'Хочу выучить', performed:'Исполнено'};
    const list = items.length ? items.map(r=>`
      <div class="rep-item" data-id="${r.id}">
        <div class="rep-title">${escapeHtml(r.title)}</div>
        ${r.composer ? `<div class="rep-composer">${escapeHtml(r.composer)}</div>` : ''}
        ${r.notes ? `<div class="rep-notes">${escapeHtml(r.notes)}</div>` : ''}
        ${(r.links&&r.links.length) ? `<div class="rep-links">${r.links.map(l=>`<a href="${escapeAttr(l.url)}" target="_blank" rel="noopener">${escapeHtml(l.label||l.url)}</a>`).join('')}</div>` : ''}
        ${state.teacherMode ? `<div class="mini-btn-row" style="margin-top:10px; margin-bottom:0;">
          ${activeTab!=='current' ? `<button class="mini-btn rep-move" data-id="${r.id}" data-to="current">→ играю</button>` : ''}
          ${activeTab!=='wishlist' ? `<button class="mini-btn rep-move" data-id="${r.id}" data-to="wishlist">→ вишлист</button>` : ''}
          ${activeTab!=='performed' ? `<button class="mini-btn rep-move" data-id="${r.id}" data-to="performed">→ исполнено</button>` : ''}
          <button class="mini-btn rep-remove" data-id="${r.id}">✕ удалить</button>
        </div>` : ''}
      </div>
    `).join('') : `<div class="rep-empty">Пока пусто.</div>`;

    overlay.querySelector('.popover').innerHTML = `
      <div class="panel-header">
        <div>
          <h3 class="display">🎵 Репертуар</h3>
          <div class="panel-sub">${escapeHtml(student.name)}</div>
        </div>
        <button class="panel-close" id="closeRepPanel">✕</button>
      </div>
      <div class="repertoire-tabs">
        <button data-tab="current" class="${activeTab==='current'?'active':''}">${tabLabels.current}</button>
        <button data-tab="wishlist" class="${activeTab==='wishlist'?'active':''}">${tabLabels.wishlist}</button>
        <button data-tab="performed" class="${activeTab==='performed'?'active':''}">${tabLabels.performed}</button>
      </div>
      ${state.teacherMode ? '<button class="mini-btn" id="addRepBtn" style="margin-bottom:14px;">＋ добавить произведение</button>' : ''}
      <div>${list}</div>
    `;
    wire();
  }

  function wire(){
    overlay.querySelector('#closeRepPanel').addEventListener('click', ()=> overlay.remove());
    overlay.querySelectorAll('.repertoire-tabs button').forEach(btn=>{
      btn.addEventListener('click', ()=>{ activeTab = btn.dataset.tab; renderPanel(); });
    });
    const addBtn = overlay.querySelector('#addRepBtn');
    if(addBtn) addBtn.addEventListener('click', ()=>{
      const title = window.prompt('Название произведения:');
      if(!title || !title.trim()) return;
      const composer = window.prompt('Композитор (необязательно):') || '';
      const id = 'r_' + Date.now();
      state.repertoire.push({id, studentId:student.id, title:title.trim(), composer:composer.trim(), status:activeTab, notes:'', links:[], addedAt:new Date().toISOString()});
      renderPanel();
      saveRepertoire();
    });
    if(state.teacherMode){
      overlay.querySelectorAll('.rep-move').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const item = state.repertoire.find(r=>r.id===btn.dataset.id);
          if(item){ item.status = btn.dataset.to; }
          renderPanel();
          saveRepertoire();
        });
      });
      overlay.querySelectorAll('.rep-remove').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          state.repertoire = state.repertoire.filter(r=>r.id!==btn.dataset.id);
          renderPanel();
          saveRepertoire();
        });
      });
    }
  }

  renderPanel();
}

function verifyTeacherPin(){
  if(state.teacherMode) return true;
  const pin = window.prompt('Введи PIN-код учителя:');
  if(pin === null) return false;
  if(pin !== TEACHER_PIN){ alert('Неверный PIN'); return false; }
  return true;
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

loadAll();
</script>
